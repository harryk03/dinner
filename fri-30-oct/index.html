<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Where are we eating?</title>
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div class="wrap" id="app"><p class="loading">Loading the shortlist…</p></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="grab" id="grab">
    <button type="button" class="sheet-close" id="sheet-close" aria-label="Close">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l10 10M12 2 2 12"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>
<script src="../assets/config.js"></script>
<script src="../assets/app.js"></script>
</body>
</html>
